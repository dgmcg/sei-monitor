<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEI Monitor v2.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#1a56db;--primary-dark:#1e429f;--success:#057a55;--warning:#c27803;--danger:#e02424;--bg:#f3f4f6;--card:#fff;--border:#e5e7eb;--text:#111827;--muted:#6b7280;--sidebar-w:240px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;}
/* SIDEBAR */
#sidebar{width:var(--sidebar-w);background:#1f2937;color:#f9fafb;display:flex;flex-direction:column;flex-shrink:0;}
#sidebar .logo{padding:20px 16px 12px;font-size:1.1rem;font-weight:700;letter-spacing:.5px;border-bottom:1px solid #374151;}
#sidebar .logo span{color:#60a5fa;}
#sidebar nav{flex:1;padding:12px 0;}
#sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#d1d5db;text-decoration:none;font-size:.9rem;cursor:pointer;transition:background .15s;}
#sidebar nav a:hover,#sidebar nav a.active{background:#374151;color:#fff;}
#sidebar nav a i{width:18px;text-align:center;}
#sidebar .user-info{padding:12px 16px;border-top:1px solid #374151;font-size:.8rem;color:#9ca3af;}
#sidebar .user-info strong{color:#f9fafb;display:block;}
#sidebar .ai-status{padding:8px 16px;font-size:.75rem;}
#sidebar .ai-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
#sidebar .ai-dot.on{background:#10b981;}
#sidebar .ai-dot.off{background:#ef4444;}
/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#topbar h1{font-size:1.1rem;font-weight:600;}
#topbar .actions{display:flex;gap:8px;}
#content{flex:1;overflow-y:auto;padding:24px;}
/* CARDS */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px;}
.process-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative;cursor:pointer;transition:box-shadow .2s,transform .2s;}
.process-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-2px);}
.process-card .sei-num{font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.5px;}
.process-card .titulo{font-weight:600;font-size:.95rem;margin:4px 0 8px;line-height:1.3;}
.process-card .situacao{font-size:.82rem;color:#374151;background:#f9fafb;border-radius:6px;padding:6px 8px;border-left:3px solid var(--primary);margin-bottom:8px;}
.process-card .ultimo-and{font-size:.78rem;color:var(--muted);margin-bottom:10px;}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.badge-prioridade{font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:20px;}
.badge-prioridade.Baixa{background:#dcfce7;color:#166534;}
.badge-prioridade.Media,.badge-prioridade.Média{background:#fef9c3;color:#854d0e;}
.badge-prioridade.Alta{background:#fee2e2;color:#991b1b;}
.badge-prioridade.Maxima,.badge-prioridade.Máxima{background:#7c3aed;color:#fff;}
.badge-status{font-size:.72rem;padding:3px 8px;border-radius:20px;background:#e5e7eb;color:#374151;}
/* ALERTA VISUAL */
@keyframes pulse-max{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,.4);}50%{box-shadow:0 0 0 8px rgba(124,58,237,0);}}
@keyframes pulse-alt{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.3);}50%{box-shadow:0 0 0 6px rgba(220,38,38,0);}}
@keyframes pulse-med{0%,100%{box-shadow:0 0 0 0 rgba(202,138,4,.3);}50%{box-shadow:0 0 0 5px rgba(202,138,4,0);}}
.alerta-maxima{border-color:#7c3aed!important;animation:pulse-max 1.2s infinite;}
.alerta-alta{border-color:#dc2626!important;animation:pulse-alt 1.8s infinite;}
.alerta-media{border-color:#ca8a04!important;animation:pulse-med 2.5s infinite;}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:none;cursor:pointer;font-size:.85rem;font-weight:500;transition:background .15s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-success{background:#057a55;color:#fff;}
.btn-success:hover{background:#046c4e;}
.btn-warning{background:#c27803;color:#fff;}
.btn-warning:hover{background:#9f6000;}
.btn-danger{background:#e02424;color:#fff;}
.btn-danger:hover{background:#c81e1e;}
.btn-secondary{background:#e5e7eb;color:#374151;}
.btn-secondary:hover{background:#d1d5db;}
.btn-sm{padding:5px 10px;font-size:.78rem;}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#fff;border-radius:12px;max-width:860px;width:100%;max-height:90vh;overflow-y:auto;padding:28px;}
.modal h2{font-size:1.2rem;margin-bottom:20px;}
/* FORM */
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:.9rem;color:var(--text);}
.form-group textarea{resize:vertical;min-height:90px;}
/* TABS */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px;}
.tab{padding:8px 16px;cursor:pointer;font-size:.87rem;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--muted);}
.tab.active{border-bottom-color:var(--primary);color:var(--primary);font-weight:600;}
/* ANDAMENTOS */
.andamento-item{padding:12px;border-left:3px solid #60a5fa;background:#f0f7ff;border-radius:0 6px 6px 0;margin-bottom:10px;}
.andamento-item .and-header{font-size:.75rem;color:var(--muted);margin-bottom:4px;}
.andamento-item .and-body{font-size:.85rem;white-space:pre-wrap;}
/* ANOTACOES */
.anotacao-item{padding:10px;border-left:3px solid #a78bfa;background:#faf5ff;border-radius:0 6px 6px 0;margin-bottom:8px;}
.anotacao-item .anot-header{font-size:.75rem;color:var(--muted);margin-bottom:4px;}
.anotacao-item .anot-body{font-size:.85rem;white-space:pre-wrap;}
/* DOCUMENTOS */
.doc-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;}
.doc-item i{color:var(--primary);font-size:1.1rem;}
.doc-item .doc-name{flex:1;font-size:.85rem;}
.doc-item .doc-meta{font-size:.75rem;color:var(--muted);}
/* IA */
.ia-box{background:linear-gradient(135deg,#eff6ff,#f0fdf4);border:1px solid #bfdbfe;border-radius:8px;padding:16px;margin-top:16px;}
.ia-box h4{color:#1e40af;font-size:.9rem;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.ia-section{margin-bottom:12px;}
.ia-section h5{font-size:.8rem;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.ia-section p{font-size:.85rem;color:#1f2937;line-height:1.5;}
/* DRAG DROP */
.dropzone{border:2px dashed var(--border);border-radius:8px;padding:32px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .2s,background .2s;}
.dropzone.over{border-color:var(--primary);background:#eff6ff;}
.dropzone i{font-size:2rem;margin-bottom:8px;display:block;}
/* RESUMO GERAL */
.resumo-geral-box{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px;}
.resumo-geral-box .rg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.resumo-geral-box .rg-header h3{font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:8px;}
.resumo-geral-box .rg-meta{font-size:.75rem;color:var(--muted);}
.resumo-geral-box .rg-content{font-size:.87rem;color:#374151;line-height:1.6;white-space:pre-wrap;}
/* CHAT FLUTUANTE */
#chat-fab{position:fixed;bottom:24px;right:24px;z-index:900;}
#chat-btn{width:54px;height:54px;border-radius:50%;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(26,86,219,.4);}
#chat-panel{position:fixed;bottom:88px;right:24px;width:360px;height:460px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.12);display:none;flex-direction:column;z-index:900;}
#chat-panel.open{display:flex;}
#chat-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:.9rem;}
#chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.chat-msg{max-width:85%;padding:8px 12px;border-radius:8px;font-size:.83rem;line-height:1.4;}
.chat-msg.user{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:2px;}
.chat-msg.ai{background:#f3f4f6;color:#1f2937;align-self:flex-start;border-bottom-left-radius:2px;}
#chat-input-row{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;}
#chat-input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:.83rem;}
/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1e3a5f,#1a56db);}
.login-card{background:#fff;border-radius:14px;padding:36px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.login-card h2{text-align:center;margin-bottom:6px;font-size:1.4rem;}
.login-card .subtitle{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:24px;}
/* UPLOAD PROGRESS */
.upload-progress{margin-top:8px;}
.up-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:.82rem;}
.up-item i{width:16px;text-align:center;}
.up-item .up-name{flex:1;}
.up-ok{color:#057a55;}
.up-dup{color:var(--muted);}
.up-err{color:var(--danger);}
.up-proc{color:var(--primary);}
/* MISC */
.alert{padding:10px 14px;border-radius:6px;font-size:.85rem;margin-bottom:12px;}
.alert-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;}
.alert-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;}
.alert-warning{background:#fffbeb;color:#92400e;border:1px solid #fde68a;}
.alert-danger{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none!important;}
.text-muted{color:var(--muted);}
.mt-2{margin-top:8px;}
.mt-4{margin-top:16px;}
.flex{display:flex;}
.gap-2{gap:8px;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
hr.divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
/* WIZARD STEPS */
.wizard-steps{display:flex;gap:0;margin-bottom:24px;}
.wizard-step{flex:1;padding:8px;text-align:center;font-size:.78rem;color:var(--muted);border-bottom:3px solid var(--border);position:relative;}
.wizard-step.done{color:var(--success);border-bottom-color:var(--success);}
.wizard-step.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}
/* ADMIN TABLE */
.admin-table{width:100%;border-collapse:collapse;font-size:.85rem;}
.admin-table th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);font-size:.78rem;color:var(--muted);text-transform:uppercase;}
.admin-table td{padding:8px 10px;border-bottom:1px solid var(--border);}
.admin-table tr:hover td{background:#f9fafb;}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="login-screen">
<div class="login-card">
  <h2>🗂 SEI Monitor</h2>
  <p class="subtitle">Sistema de Monitoramento de Processos v2.0</p>
  <div class="form-group">
    <label>URL do Apps Script</label>
    <input type="url" id="api-url-input" placeholder="https://script.google.com/macros/s/.../exec" style="font-size:.78rem;">
  </div>
  <div class="form-group">
    <label>Usuário</label>
    <input type="text" id="login-email" placeholder="nome.sobrenome" autocomplete="username" autocapitalize="none">
  </div>
  <div class="form-group">
    <label>Senha</label>
    <input type="password" id="login-senha">
  </div>
  <div id="login-error" class="alert alert-danger hidden"></div>
  <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="fazerLogin()">
    <i class="fa fa-sign-in-alt"></i> Entrar
  </button>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden" style="display:flex;flex:1;height:100vh;">
<div id="sidebar">
  <div class="logo">SEI <span>Monitor</span></div>
  <nav>
    <a onclick="showView('dashboard')" id="nav-dashboard"><i class="fa fa-th-large"></i>Dashboard</a>
    <a onclick="showView('novo')" id="nav-novo"><i class="fa fa-plus-circle"></i>Novo Processo</a>
    <a onclick="showView('admin')" id="nav-admin" class="hidden"><i class="fa fa-cog"></i>Administração</a>
  </nav>
  <div class="ai-status">
    <span class="ai-dot" id="ai-dot"></span><span id="ai-status-txt">Verificando IA...</span>
  </div>
  <div class="user-info">
    <strong id="sidebar-nome">—</strong>
    <span id="sidebar-email"></span><br>
    <a href="#" onclick="logout()" style="color:#60a5fa;font-size:.75rem;">Sair</a>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <h1 id="page-title">Dashboard</h1>
    <div class="actions">
      <input type="text" id="search-input" placeholder="🔍 Buscar processo..." style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:.85rem;width:220px;" oninput="filtrarCards()">
      <button class="btn btn-primary" onclick="showView('novo')"><i class="fa fa-plus"></i> Novo</button>
    </div>
  </div>
  <div id="content"></div>
</div>
</div>

<!-- CHAT FAB -->
<div id="chat-fab">
  <button id="chat-btn" onclick="toggleChat()" title="Assistente IA"><i class="fa fa-robot"></i></button>
  <div id="chat-panel">
    <div id="chat-header">
      <span><i class="fa fa-robot" style="color:var(--primary);margin-right:6px;"></i>Assistente IA</span>
      <button onclick="toggleChat()" style="background:none;border:none;cursor:pointer;font-size:1rem;">✕</button>
    </div>
    <div id="chat-msgs"><div class="chat-msg ai">Olá! Posso responder perguntas sobre os processos monitorados. Como posso ajudar?</div></div>
    <div id="chat-input-row">
      <input id="chat-input" placeholder="Digite sua pergunta..." onkeydown="if(event.key==='Enter')enviarChat()">
      <button class="btn btn-primary btn-sm" onclick="enviarChat()"><i class="fa fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const LIMITE_HORAS = { 'Máxima': 2, 'Alta': 24, 'Média': 48, 'Baixa': 96 };
const OLLAMA_URL = 'http://localhost:11434/api/generate';
let OLLAMA_MODEL = localStorage.getItem('ollama_model') || 'llama3.2:3b';
const BLOCO_MAX = 49000;
const RELEVANCIA_MAX_CHARS = 25000;

// ==================== STATE ====================
let API_URL = '';
let sessao = null;
let usuarioAtual = null;
let todosProcessos = [];

// ==================== INIT ====================
window.onload = () => {
  API_URL = localStorage.getItem('sei_api_url') || '';
  if (API_URL) document.getElementById('api-url-input').value = API_URL;
  verificarOllama();
};

// ==================== API ====================
async function api(path, body = null) {
  // Separa o path dos query params extras (ex: 'processos/obter?sei=123' → path + &sei=123)
  const [basePath, queryStr] = path.split('?');
  let url = API_URL + (API_URL.includes('?') ? '&' : '?') + 'path=' + encodeURIComponent(basePath);
  if (queryStr) url += '&' + queryStr;
  // Para GET, envia o token na URL
  if (!body && sessao?.token) url += '&token=' + encodeURIComponent(sessao.token);
  const opts = { redirect: 'follow' };
  if (body) {
    opts.method = 'POST';
    opts.headers = { 'Content-Type': 'text/plain' };
    opts.body = JSON.stringify({ ...body, token: sessao?.token });
  } else {
    opts.method = 'GET';
  }
  let r, text;
  try {
    r = await fetch(url, opts);
    text = await r.text();
  } catch(e) { return { ok: false, erro: 'Erro de rede: ' + e.message }; }
  try { return JSON.parse(text); } catch { return { ok: false, erro: text }; }
}

// ==================== AUTH ====================
async function fazerLogin() {
  const urlInput = document.getElementById('api-url-input').value.trim();
  const usuario = document.getElementById('login-email').value.trim().toLowerCase();
  const senha = document.getElementById('login-senha').value;
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  if (!urlInput) { errEl.textContent = 'Informe a URL do Apps Script.'; errEl.classList.remove('hidden'); return; }
  API_URL = urlInput;
  localStorage.setItem('sei_api_url', API_URL);
  const senhaHash = await sha256(senha);
  const res = await api('auth/login', { usuario, senha: senhaHash });
  if (!res.ok) { errEl.textContent = res.erro || 'Credenciais inválidas.'; errEl.classList.remove('hidden'); return; }
  sessao = res.sessao;
  usuarioAtual = res.usuario;
  iniciarApp();
  api('log/registrar', { acao: 'LOGIN', detalhes: 'Login realizado' });
}

function logout() {
  if (sessao) api('auth/logout', { token: sessao.token });
  sessao = null; usuarioAtual = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').style.display = '';
}

function iniciarApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('sidebar-nome').textContent = usuarioAtual.nome;
  document.getElementById('sidebar-email').textContent = usuarioAtual.usuario;
  if (usuarioAtual.perfil === 'admin') document.getElementById('nav-admin').classList.remove('hidden');
  carregarDadosFixos(); // pré-carrega tipos e unidades
  showView('dashboard');
  verificarOllama();
}

// ==================== VIEWS ====================
function showView(v) {
  document.querySelectorAll('#sidebar nav a').forEach(a => a.classList.remove('active'));
  const el = document.getElementById('nav-' + v);
  if (el) el.classList.add('active');
  const titles = { dashboard: 'Dashboard', novo: 'Novo Processo', admin: 'Administração' };
  document.getElementById('page-title').textContent = titles[v] || v;
  if (v === 'dashboard') renderDashboard();
  else if (v === 'novo') renderNovo();
  else if (v === 'admin') renderAdmin();
}

// ==================== DASHBOARD ====================
async function renderDashboard() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="text-muted"><span class="spinner"></span> Carregando processos...</div>';

  // Carrega processos
  let res;
  try { res = await api('processos/listar'); } catch(e) { res = { ok: false, erro: e.message }; }
  if (!res.ok) { content.innerHTML = `<div class="alert alert-danger">${res.erro || 'Erro ao carregar processos.'}</div>`; return; }
  todosProcessos = res.processos || [];

  // Monta a UI imediatamente (não bloqueia no resumo geral)
  content.innerHTML = '';

  // Resumo geral — placeholder que será preenchido em background
  const rgBox = document.createElement('div');
  rgBox.id = 'resumo-geral-container';
  rgBox.innerHTML = '<div class="resumo-geral-box" style="opacity:.5;"><div class="rg-header"><h3><i class="fa fa-brain" style="color:var(--primary);"></i> Resumo do Período</h3></div><div class="rg-content text-muted"><span class="spinner"></span> Verificando resumo...</div></div>';
  content.appendChild(rgBox);

  // Filtros rápidos
  const filtros = document.createElement('div');
  filtros.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;';
  filtros.innerHTML = `
    <button class="btn btn-secondary btn-sm" onclick="filtrarPorStatus('')">Todos</button>
    <button class="btn btn-secondary btn-sm" onclick="filtrarPorStatus('Em andamento')">Em andamento</button>
    <button class="btn btn-secondary btn-sm" onclick="filtrarPorStatus('Aguardando')">Aguardando</button>
    <button class="btn btn-secondary btn-sm" onclick="filtrarPorStatus('Concluído')">Concluídos</button>
    <select onchange="filtrarPorPrioridade(this.value)" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:.78rem;">
      <option value="">Todas prioridades</option>
      <option>Máxima</option><option>Alta</option><option>Média</option><option>Baixa</option>
    </select>`;
  content.appendChild(filtros);

  // Grid de cards
  const grid = document.createElement('div');
  grid.className = 'cards-grid';
  grid.id = 'cards-grid';
  content.appendChild(grid);
  renderCards(todosProcessos, grid);

  // Resumo geral em background — não bloqueia a renderização dos cards
  (async () => {
    try {
      await verificarEGerarResumoGeral();
      const rgBoxAtual = document.getElementById('resumo-geral-container');
      if (rgBoxAtual) await renderResumoGeral(rgBoxAtual);
    } catch(e) {
      const rgBoxAtual = document.getElementById('resumo-geral-container');
      if (rgBoxAtual) rgBoxAtual.innerHTML = '';
    }
  })();
}

function renderCards(lista, grid) {
  grid.innerHTML = '';
  if (!lista.length) { grid.innerHTML = '<p class="text-muted">Nenhum processo encontrado.</p>'; return; }
  lista.forEach(p => {
    const card = criarCard(p);
    grid.appendChild(card);
  });
}

function criarCard(p) {
  const sei = p.numero_sei || p.sei;
  const div = document.createElement('div');
  div.className = 'process-card';
  const horas = horasDesdeData(p.data_atualizacao || p.data_cadastro);
  const limite = LIMITE_HORAS[p.prioridade] || 96;
  const atrasado = horas > limite;
  if (atrasado) {
    if (p.prioridade === 'Máxima') div.classList.add('alerta-maxima');
    else if (p.prioridade === 'Alta') div.classList.add('alerta-alta');
    else if (p.prioridade === 'Média') div.classList.add('alerta-media');
  }
  const priBadge = (p.prioridade || '').replace('á','a').replace('é','e');
  div.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div class="sei-num">SEI: ${sei}</div>
      <button class="btn-deletar-card" onclick="deletarProcessoCard(event,'${sei}')" title="Excluir processo"
        style="background:none;border:none;cursor:pointer;color:#d1d5db;font-size:.85rem;padding:0;line-height:1;">
        <i class="fa fa-trash"></i>
      </button>
    </div>
    <div class="titulo">${p.titulo}</div>
    ${p.situacao_atual ? `<div class="situacao">${p.situacao_atual}</div>` : ''}
    ${p.ultimo_andamento_resumo ? `<div class="ultimo-and"><i class="fa fa-clock" style="margin-right:4px;color:var(--muted);"></i>${p.ultimo_andamento_resumo}${p.ultimo_andamento_data ? ' <small>('+formatarData(p.ultimo_andamento_data)+')</small>' : ''}</div>` : ''}
    <div class="card-footer">
      <span class="badge-prioridade ${priBadge}">${p.prioridade}</span>
      <span class="badge-status">${p.status}</span>
      ${atrasado ? `<span style="color:${p.prioridade==='Máxima'?'#7c3aed':p.prioridade==='Alta'?'#dc2626':'#ca8a04'};font-size:.72rem;font-weight:600;">⚠ Atrasado</span>` : ''}
    </div>`;
  div.onclick = () => abrirProcesso(sei);
  return div;
}

async function deletarProcessoCard(event, sei) {
  event.stopPropagation(); // não abre o processo
  if (!confirm(`Excluir o processo SEI ${sei}?\n\nEsta ação não pode ser desfeita.`)) return;
  const res = await api('processos/deletar', { sei });
  if (res.ok) {
    todosProcessos = todosProcessos.filter(p => (p.numero_sei || p.sei) !== sei);
    aplicarFiltros();
    await api('log/registrar', { acao: 'DELETAR_PROCESSO', referencia: sei, detalhes: 'Excluído do dashboard' });
  } else {
    alert('Erro ao excluir: ' + (res.erro || 'Tente novamente.'));
  }
}

let filtroStatus = '', filtroPrioridade = '', filtroTexto = '';
function filtrarPorStatus(s) { filtroStatus = s; aplicarFiltros(); }
function filtrarPorPrioridade(s) { filtroPrioridade = s; aplicarFiltros(); }
function filtrarCards() { filtroTexto = document.getElementById('search-input').value.toLowerCase(); aplicarFiltros(); }
function aplicarFiltros() {
  let lista = todosProcessos;
  if (filtroStatus) lista = lista.filter(p => p.status === filtroStatus);
  if (filtroPrioridade) lista = lista.filter(p => p.prioridade === filtroPrioridade);
  if (filtroTexto) lista = lista.filter(p => (p.sei+p.titulo+p.situacao_atual+'').toLowerCase().includes(filtroTexto));
  renderCards(lista, document.getElementById('cards-grid'));
}

// ==================== RESUMO GERAL ====================
function getPeriodo() {
  const h = new Date().getHours();
  if (h >= 6 && h < 12) return 'manha';
  if (h >= 13 && h < 18) return 'tarde';
  return null;
}

async function verificarEGerarResumoGeral() {
  const periodo = getPeriodo();
  if (!periodo) return;
  const res = await api('resumo-geral/obter?periodo=' + periodo);
  if (res.ok && res.resumo && res.resumo.conteudo) return; // já existe
  // Primeiro do período — gerar
  const ollamaOk = await testarOllama();
  if (!ollamaOk) return;
  const processos = todosProcessos;
  if (!processos.length) return;
  const lista = processos.slice(0, 20).map(p =>
    `SEI ${p.sei}: ${p.titulo} (${p.status}, ${p.prioridade}) — ${p.situacao_atual || 'sem situação atual'}`
  ).join('\n');
  const turno = periodo === 'manha' ? 'manhã' : 'tarde';
  const prompt = `Você é analista de processos administrativos de uma Organização Social de Saúde. 
Gere um resumo gerencial de ${turno} sobre os processos abaixo. Identifique prioridades críticas, processos em risco e pontos de atenção.
Seja objetivo, máx 300 palavras.

PROCESSOS:
${lista}

RESUMO GERENCIAL DE ${turno.toUpperCase()}:`;
  try {
    const resp = await fetch(OLLAMA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: OLLAMA_MODEL, prompt, stream: false })
    });
    const data = await resp.json();
    const conteudo = data.response || '';
    await api('resumo-geral/salvar', { periodo, conteudo });
    await api('log/registrar', { acao: 'RESUMO_GERAL', detalhes: `Gerado resumo de ${turno}` });
  } catch(e) { console.warn('Erro ao gerar resumo geral:', e); }
}

async function renderResumoGeral(container) {
  const periodo = getPeriodo();
  if (!periodo) { container.innerHTML = ''; return; }
  const res = await api('resumo-geral/obter?periodo=' + periodo);
  const turno = periodo === 'manha' ? '🌅 Resumo da Manhã' : '🌇 Resumo da Tarde';
  const conteudo = (res.ok && res.resumo) ? res.resumo.conteudo : null;
  const horario = (res.ok && res.resumo) ? res.resumo.data_geracao : null;
  container.innerHTML = `
  <div class="resumo-geral-box">
    <div class="rg-header">
      <h3><i class="fa fa-brain" style="color:var(--primary);"></i> ${turno}</h3>
      <span class="rg-meta">${horario ? 'Gerado às '+formatarDataHora(horario) : 'Aguardando geração...'}</span>
    </div>
    <div class="rg-content">${conteudo || '<span class="text-muted">Resumo ainda não gerado para este período.</span>'}</div>
  </div>`;
}

// ==================== UTILITÁRIOS LINK SEI ====================

// Extrai o código verificador do nome do arquivo SEI
// Formato: [seq]-{CODIGO}_{ORGAO}___{TIPO}_{NUM}.{ext}
function extrairCodigoSEI(nomeArquivo) {
  const m = nomeArquivo.match(/\[\d+\]-(\d{6,})[_\.]/);
  return m ? m[1] : null;
}

// Extrai o CRC do texto extraído do documento
function extrairCRCSEI(texto) {
  const m = texto.match(/c[oó]digo\s+CRC\s+([A-F0-9]{6,})/i);
  return m ? m[1] : null;
}

// Extrai a URL base do SEI do conteúdo do documento
// Ex: "http://sei.pe.gov.br/sei/controlador_externo.php..." → "https://sei.pe.gov.br/sei"
function extrairUrlBaseSEI(texto) {
  const m = texto.match(/(https?:\/\/[^\s\/]+\/sei)\/controlador_externo/i);
  if (m) return m[1];
  // tenta também na URL do link href
  const m2 = texto.match(/href="(https?:\/\/[^\s"\/]+\/sei)\/controlador/i);
  return m2 ? m2[1] : null;
}

// Monta o link público de verificação (funciona sem login)
function buildLinkVerificacao(baseUrl, codigo, crc) {
  if (!codigo) return null;
  const base = baseUrl || localStorage.getItem('sei_base_url') || 'https://sei.pe.gov.br/sei';
  let url = `${base}/controlador_externo.php?acao=documento_conferir&id_orgao_acesso_externo=0&codigo_verificador=${codigo}`;
  if (crc) url += `&crc=${crc}`;
  return url;
}

// Constrói link do processo sem o infra_hash (que expira)
// Mantém id_procedimento, infra_sistema, infra_unidade_atual
function buildLinkProcessoEstavel(url) {
  try {
    const u = new URL(url);
    const p = new URLSearchParams(u.search);
    p.delete('infra_hash');
    p.delete('acao_origem');
    p.delete('acao_retorno');
    return u.origin + u.pathname + '?' + p.toString();
  } catch(e) { return url; }
}

// ==================== LINK SEI DO PROCESSO ====================
async function definirLinkSEI(sei) {
  const link = prompt('Cole o link do processo no portal SEI:\n(ex: https://sei.pe.gov.br/sei/controlador.php?acao=procedimento_trabalhar&id_procedimento=...)\n\nCopie diretamente do navegador enquanto estiver com o processo aberto no SEI.');
  if (link === null) return; // cancelou
  const linkTrimado = link.trim();
  // Remove infra_hash (expira por sessão), mantém id_procedimento e demais parâmetros estáveis
  const linkEstavel = buildLinkProcessoEstavel(linkTrimado);
  // Salva também a URL base do SEI para uso nos links de documentos
  try {

async function processarArquivos(files, sei) {
  const prog = document.getElementById('upload-progress');
  const todosArquivos = [];

  // Expandir ZIPs
  for (const f of Array.from(files)) {
    if (f.name.toLowerCase().endsWith('.zip')) {
      addProgItem(prog, f.name, 'proc', 'Extraindo ZIP...');
      try {
        const zip = await JSZip.loadAsync(f);
        for (const [nome, zipEntry] of Object.entries(zip.files)) {
          if (!zipEntry.dir && /\.(pdf|docx?|xlsx?|html?)$/i.test(nome)) {
            const blob = await zipEntry.async('blob');
            const file2 = new File([blob], nome.split('/').pop(), { type: blob.type });
            todosArquivos.push(file2);
          }
        }
        updateProgItem(prog, f.name, 'ok', 'ZIP extraído');
      } catch(e) { updateProgItem(prog, f.name, 'err', 'Erro ao extrair ZIP'); }
    } else {
      todosArquivos.push(f);
    }
  }

  // Processar cada arquivo (sem Drive — apenas texto + metadados)
  for (const file of todosArquivos) {
    addProgItem(prog, file.name, 'proc', 'Verificando...');
    try {
      const buf = await file.arrayBuffer();
      const hash = await sha256Buf(buf);

      // Verificar duplicata
      const resHash = await api('documentos/verificar-hash', { numero_sei: sei, hash: hash });
      if (resHash.existe) {
        updateProgItem(prog, file.name, 'dup', 'Duplicata ignorada');
        continue;
      }

      updateProgItem(prog, file.name, 'proc', 'Extraindo texto...');
      const texto = await extrairTexto(file, buf);

      // Auto-detectar link de verificação SEI a partir do nome e conteúdo
      const codigoSEI = extrairCodigoSEI(file.name);
      const crcSEI = texto ? extrairCRCSEI(texto) : null;
      // Detectar e salvar URL base do SEI a partir do HTML (melhora precisão)
      if (texto && file.name.toLowerCase().match(/\.(html?)/)) {
        const detectedBase = extrairUrlBaseSEI(texto);
        if (detectedBase) localStorage.setItem('sei_base_url', detectedBase);
      }
      const linkVerificacao = buildLinkVerificacao(null, codigoSEI, crcSEI);

      // Registrar metadados (sem Drive)
      const resReg = await api('documentos/registrar', {
        numero_sei: sei,
        nome_arquivo: file.name,
        hash_arquivo: hash,
        tamanho: file.size,
        link_verificacao: linkVerificacao || ''
      });
      if (!resReg.ok) { updateProgItem(prog, file.name, 'err', resReg.erro || 'Falha ao registrar'); continue; }

      const docId = resReg.doc_id;

      // Salvar blocos de texto no Sheets
      if (texto && texto.trim().length > 0) {
        updateProgItem(prog, file.name, 'proc', 'Salvando texto...');
        await salvarBlocosSheets(sei, docId, file.name, texto);
      }

      await api('log/registrar', { acao: 'IMPORTAR_DOCUMENTO', referencia: sei, detalhes: file.name });
      updateProgItem(prog, file.name, 'ok', texto ? 'Importado — texto extraído' : 'Importado — sem texto');
    } catch(e) {
      updateProgItem(prog, file.name, 'err', 'Erro: ' + e.message);
    }
  }

  // Acionar IA
  const statusSpan = document.createElement('div');
  statusSpan.className = 'alert alert-info mt-2';
  statusSpan.innerHTML = '<span class="spinner"></span> Acionando análise de IA...';
  prog.appendChild(statusSpan);
  await acionarIA(sei);
  statusSpan.className = 'alert alert-success mt-2';
  statusSpan.innerHTML = '<i class="fa fa-check"></i> Análise de IA concluída!';
}

// ==================== TEXTO EXTRACTION ====================
async function extrairTexto(file, buf) {
  const nome = file.name.toLowerCase();
  try {
    if (nome.endsWith('.pdf')) return await extrairPDF(buf);
    if (nome.endsWith('.docx') || nome.endsWith('.doc')) {
      const res = await mammoth.extractRawText({ arrayBuffer: buf });
      return res.value || '';
    }
    if (nome.endsWith('.xlsx') || nome.endsWith('.xls')) {
      const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
      return wb.SheetNames.map(sn => XLSX.utils.sheet_to_csv(wb.Sheets[sn])).join('\n\n');
    }
    if (nome.endsWith('.html') || nome.endsWith('.htm')) {
      const decoder = new TextDecoder('utf-8');
      const html = decoder.decode(buf);
      const doc = new DOMParser().parseFromString(html, 'text/html');
      return doc.body ? doc.body.innerText || doc.body.textContent : '';
    }
  } catch(e) { console.warn('Erro ao extrair texto de', file.name, e); }
  return '';
}

async function extrairPDF(buf) {
  // Usa PDF.js via CDN se disponível, senão tenta método simples
  if (typeof pdfjsLib !== 'undefined') {
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    let texto = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      texto += content.items.map(item => item.str).join(' ') + '\n';
    }
    return texto;
  }
  // Fallback: extração simples de texto de PDF
  const decoder = new TextDecoder('latin1');
  const text = decoder.decode(buf);
  const matches = text.match(/\(([^\)]{2,})\)/g) || [];
  return matches.map(m => m.slice(1,-1)).join(' ');
}

// ==================== BLOCOS SHEETS ====================
function dividirEmBlocos(texto, maxChars) {
  const blocos = [];
  let i = 0;
  while (i < texto.length) {
    blocos.push(texto.substring(i, i + maxChars));
    i += maxChars;
  }
  return blocos;
}

async function salvarBlocosSheets(sei, docId, docNome, texto) {
  const blocos = dividirEmBlocos(texto, BLOCO_MAX);
  for (let i = 0; i < blocos.length; i++) {
    await api('conteudo/salvar-bloco', {
      sei, doc_id: docId, doc_nome: docNome,
      bloco_num: i + 1, total_blocos: blocos.length,
      conteudo: blocos[i]
    });
  }
}

// ==================== IA ANÁLISE ====================
async function acionarIA(sei) {
  const ollamaOk = await testarOllama();
  if (!ollamaOk) return;

  // Busca blocos de conteúdo
  const resConteudo = await api('conteudo/listar?sei=' + sei);
  const blocos = (resConteudo.blocos || []).map(b => b.conteudo || '');

  // Busca bases legais
  const resBases = await api('bases-legais/listar');
  const basesLegais = (resBases.blocos || []).map(b => b.conteudo || '');

  // Busca dados do processo
  const [resP, resA, resAnot] = await Promise.all([
    api('processos/obter?sei=' + sei),
    api('andamentos/listar?sei=' + sei),
    api('anotacoes/listar?sei=' + sei)
  ]);

  const proc = resP.processo || {};
  const andamentos = (resA.andamentos || []).slice(-5).map(a => `${a.data_hora}: ${a.descricao}`).join('\n');
  const anotacoes = (resAnot.anotacoes || []).slice(-3).map(a => `${a.data_hora}: ${a.conteudo}`).join('\n');

  // Filtrar blocos relevantes
  const keywords = [proc.titulo||'', proc.tipo||'', sei, 'contrato', 'prazo', 'pagamento', 'execução', 'saúde']
    .join(' ').toLowerCase().split(/\s+/).filter(k => k.length > 3);

  const conteudoFiltrado = filtrarBlocos(blocos, keywords, RELEVANCIA_MAX_CHARS);
  const basesLegaisFiltradas = filtrarBlocos(basesLegais, keywords, 10000);

  const prompt = `Você é um especialista em gestão de contratos e processos administrativos de Organização Social de Saúde (OSS).
Analise o processo abaixo e gere uma análise estruturada.

PROCESSO: SEI ${sei}
TÍTULO: ${proc.titulo || ''}
TIPO: ${proc.tipo || ''}
STATUS: ${proc.status || ''}
PRIORIDADE: ${proc.prioridade || ''}
CONTRATADA: ${proc.contratada || ''}

ÚLTIMOS ANDAMENTOS:
${andamentos || 'Sem andamentos.'}

ANOTAÇÕES RECENTES:
${anotacoes || 'Sem anotações.'}

${conteudoFiltrado ? 'CONTEÚDO DOS DOCUMENTOS:\n' + conteudoFiltrado : ''}
${basesLegaisFiltradas ? '\nBASES LEGAIS APLICÁVEIS:\n' + basesLegaisFiltradas : ''}

Responda EXATAMENTE neste formato JSON (sem markdown, sem explicações antes/depois):
{
  "categoria": "categoria do processo em 3-5 palavras",
  "situacao_atual": "situação atual em 1-2 frases curtas",
  "resumo": "resumo detalhado do processo",
  "apontamentos": "pontos críticos e riscos identificados",
  "sugestoes": "sugestões de ação",
  "proximos_passos": "próximos passos concretos recomendados"
}`;

  try {
    const resp = await fetch(OLLAMA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: OLLAMA_MODEL, prompt, stream: false })
    });
    const data = await resp.json();
    const raw = (data.response || '').trim();
    
    // Extrai JSON da resposta
    let ia;
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (jsonMatch) {
      try { ia = JSON.parse(jsonMatch[0]); } catch { ia = null; }
    }
    if (!ia) {
      // Fallback: salva resposta bruta como resumo
      ia = { categoria: 'Análise', situacao_atual: '', resumo: raw, apontamentos: '', sugestoes: '', proximos_passos: '' };
    }

    await api('processos/salvar-ia', {
      sei,
      ia_categoria: ia.categoria || '',
      ia_resumo: ia.resumo || '',
      ia_apontamentos: ia.apontamentos || '',
      ia_sugestoes: ia.sugestoes || '',
      ia_proximos_passos: ia.proximos_passos || '',
      ia_situacao_atual: ia.situacao_atual || '',
      ia_data_analise: new Date().toISOString()
    });
    await api('log/registrar', { acao: 'ANALISE_IA', referencia: sei, detalhes: 'Análise concluída' });
  } catch(e) { console.warn('Erro na análise IA:', e); }
}

function filtrarBlocos(blocos, keywords, maxChars) {
  if (!blocos.length) return '';
  // Pontuar cada bloco por relevância
  const pontuados = blocos.map(b => {
    const bl = b.toLowerCase();
    const score = keywords.reduce((acc, k) => acc + (bl.split(k).length - 1), 0);
    return { b, score };
  }).sort((a, b2) => b2.score - a.score);

  let resultado = '';
  for (const { b } of pontuados) {
    if (resultado.length + b.length > maxChars) break;
    resultado += b + '\n---\n';
  }
  return resultado;
}

      <div class="flex gap-2 mt-4">
        <button class="btn btn-secondary" onclick="wizardPrev()"><i class="fa fa-arrow-left"></i> Voltar</button>
        <button class="btn btn-success" onclick="cadastrarProcesso()"><i class="fa fa-save"></i> Cadastrar Processo</button>
      </div>`;
  }
  // Atualizar indicadores
  for (let i = 1; i <= 5; i++) {
    const ws = document.getElementById('ws'+i);
    if (ws) {
      ws.className = 'wizard-step' + (i < wizardStep ? ' done' : i === wizardStep ? ' active' : '');
    }
  }
}

function wizardNext() {
  if (wizardStep === 1) {
    novoProc.sei = document.getElementById('w-sei').value.trim();
    novoProc.titulo = document.getElementById('w-titulo').value.trim();
    novoProc.tipo = document.getElementById('w-tipo').value;
    if (!novoProc.sei || !novoProc.titulo) { alert('Preencha SEI e Título.'); return; }
  } else if (wizardStep === 2) {
    novoProc.status = document.getElementById('w-status').value;
    novoProc.prioridade = document.getElementById('w-prioridade').value;
    novoProc.unidade = document.getElementById('w-unidade')?.value || '';
    if (novoProc.unidade === '__nova__') novoProc.unidade = '';
    novoProc.oss = document.getElementById('w-oss')?.value.trim() || '';
    novoProc.descricao = document.getElementById('w-descricao').value.trim();
  } else if (wizardStep === 4) {
    novoProc.andamentos = document.getElementById('w-andamentos').value.trim();
  }
  wizardStep = Math.min(wizardStep + 1, 5);
  renderWizardStep();
}
function wizardPrev() { wizardStep = Math.max(wizardStep - 1, 1); renderWizardStep(); }

function mostrarArquivosSelecionados() {

async function cadastrarProcesso() {
  const statusEl = document.getElementById('novo-status');
  statusEl.innerHTML = '<span class="spinner"></span> Cadastrando processo...';

  const res = await api('processos/criar', {
    sei: novoProc.sei, titulo: novoProc.titulo, tipo: novoProc.tipo,
    status: novoProc.status, prioridade: novoProc.prioridade,
    unidade: novoProc.unidade, oss: novoProc.oss,
    descricao: novoProc.descricao
  });

  if (!res.ok) { statusEl.innerHTML = `<div class="alert alert-danger">${res.erro}</div>`; return; }
  await api('log/registrar', { acao: 'CRIAR_PROCESSO', referencia: novoProc.sei, detalhes: novoProc.titulo });

  // Importar documentos (extração de texto — sem Drive)
  if (novoProc._files && novoProc._files.length > 0) {
    statusEl.innerHTML = '<span class="spinner"></span> Importando documentos...';
    for (const file of Array.from(novoProc._files)) {
      try {
        const buf = await file.arrayBuffer();
        const hash = await sha256Buf(buf);
        const texto = await extrairTexto(file, buf);
        const codigoSEI = extrairCodigoSEI(file.name);
        const crcSEI = texto ? extrairCRCSEI(texto) : null;
        if (texto && file.name.toLowerCase().match(/\.html?/)) {
          const detectedBase = extrairUrlBaseSEI(texto);
          if (detectedBase) localStorage.setItem('sei_base_url', detectedBase);
        }
        const linkVerificacao = buildLinkVerificacao(null, codigoSEI, crcSEI);
        const resReg = await api('documentos/registrar', {
          numero_sei: novoProc.sei, nome_arquivo: file.name,
          hash_arquivo: hash, tamanho: file.size,
          link_verificacao: linkVerificacao || ''
        });
        if (resReg.ok && texto) await salvarBlocosSheets(novoProc.sei, resReg.doc_id, file.name, texto);
      } catch(e) { console.warn('Erro ao importar', file.name, e); }
    }
  }

  // Indexar andamentos
  if (novoProc.andamentos) {
    statusEl.innerHTML = '<span class="spinner"></span> Indexando andamentos...';
    await api('andamentos/indexar', { sei: novoProc.sei, texto_bruto: novoProc.andamentos });
  }

  // Acionar IA se há conteúdo
  if (novoProc._files?.length || novoProc.andamentos) {
    statusEl.innerHTML = '<span class="spinner"></span> Gerando análise de IA...';
    await acionarIA(novoProc.sei);
  }

  statusEl.innerHTML = '<div class="alert alert-success"><i class="fa fa-check"></i> Processo cadastrado com sucesso!</div>';
  setTimeout(() => abrirProcesso(novoProc.sei), 1500);
}

async function importarBasesLegais(files) {
  const prog = document.getElementById('bases-progress');
  for (const file of Array.from(files)) {
    addProgItem(prog, file.name, 'proc', 'Extraindo texto...');
    try {
      const buf = await file.arrayBuffer();
      const texto = await extrairTexto(file, buf);
      if (!texto || texto.trim().length < 50) {
        updateProgItem(prog, file.name, 'err', 'Sem texto extraído');
        continue;
      }
      const blocos = dividirEmBlocos(texto, BLOCO_MAX);
      for (let i = 0; i < blocos.length; i++) {
        await api('bases-legais/salvar', {
          doc_nome: file.name, bloco_num: i+1, total_blocos: blocos.length, conteudo: blocos[i]
        });
      }
      await api('log/registrar', { acao: 'IMPORTAR_BASE_LEGAL', detalhes: file.name });
      updateProgItem(prog, file.name, 'ok', `${blocos.length} bloco(s) salvos`);
    } catch(e) { updateProgItem(prog, file.name, 'err', 'Erro: '+e.message); }
  }
}

async function enviarChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  const msgs = document.getElementById('chat-msgs');
  msgs.innerHTML += `<div class="chat-msg user">${msg}</div>`;
  msgs.scrollTop = msgs.scrollHeight;

  // Monta contexto dos processos
  const ctx = todosProcessos.slice(0, 15).map(p =>
    `SEI ${p.sei}: ${p.titulo} (${p.status}, ${p.prioridade}) — ${p.situacao_atual||''}`
  ).join('\n');

  const prompt = `Você é um assistente de monitoramento de processos administrativos de uma Organização Social de Saúde.

PROCESSOS EM ACOMPANHAMENTO:
${ctx || 'Nenhum processo carregado.'}

PERGUNTA DO USUÁRIO: ${msg}

Responda de forma objetiva e útil em português.`;

  const loadMsg = document.createElement('div');
  loadMsg.className = 'chat-msg ai';
  loadMsg.innerHTML = '<span class="spinner"></span>';
  msgs.appendChild(loadMsg);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const ollamaOk = await testarOllama();
    if (!ollamaOk) { loadMsg.textContent = 'IA não disponível. Verifique o Ollama.'; return; }
    const resp = await fetch(OLLAMA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: OLLAMA_MODEL, prompt, stream: false })
    });
    const data = await resp.json();
    loadMsg.textContent = data.response || 'Sem resposta.';
  } catch(e) {
    loadMsg.textContent = 'Erro ao contatar IA: ' + e.message;
  }
  msgs.scrollTop = msgs.scrollHeight;
}

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.onclick = e => { if (e.target === overlay) fecharModal(); };
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = html;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  return overlay;
}
function fecharModal() {
  const m = document.getElementById('modal-overlay');
  if (m) m.remove();
}

// ==================== UTILS ====================
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  return sha256Hex(await crypto.subtle.digest('SHA-256', buf));
}
async function sha256Buf(buf) {
  return sha256Hex(await crypto.subtle.digest('SHA-256', buf));
}
function sha256Hex(hashBuf) {
  return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function bufToBase64(buf) {
  let binary = '';
  const bytes = new Uint8Array(buf);
  const len = bytes.byteLength;
  for (let i = 0; i < len; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
function horasDesdeData(dataStr) {
  if (!dataStr) return 9999;
  const d = new Date(dataStr);
  if (isNaN(d)) return 9999;
  return (Date.now() - d.getTime()) / 3600000;
}
function formatarData(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString('pt-BR');
}
function formatarDataHora(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleString('pt-BR');
}
function formatarTamanho(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}
function iconDoc(nome) {
  if (!nome) return 'fa fa-file';
  const ext = nome.split('.').pop().toLowerCase();
  const icons = { pdf: 'fa fa-file-pdf', doc: 'fa fa-file-word', docx: 'fa fa-file-word', xls: 'fa fa-file-excel', xlsx: 'fa fa-file-excel', zip: 'fa fa-file-archive', html: 'fa fa-file-code', htm: 'fa fa-file-code' };
  return icons[ext] || 'fa fa-file';
}
