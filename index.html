<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEI Monitor v2.1</title>
<!-- Dependências externas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Estilos do sistema -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
<div class="login-card">
  <h2>🗂 SEI Monitor</h2>
  <p class="subtitle">Sistema de Monitoramento de Processos v2.1</p>
  <div class="form-group">
    <label>URL do Apps Script</label>
    <input type="url" id="api-url-input" placeholder="https://script.google.com/macros/s/.../exec" style="font-size:.78rem;">
  </div>
  <div class="form-group">
    <label>Usuário</label>
    <input type="text" id="login-email" placeholder="nome.sobrenome" autocomplete="username" autocapitalize="none">
  </div>
  <div class="form-group">
    <label>Senha</label>
    <input type="password" id="login-senha" onkeydown="if(event.key==='Enter')fazerLogin()">
  </div>
  <div id="login-error" class="alert alert-danger hidden"></div>
  <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="fazerLogin()">
    <i class="fa fa-sign-in-alt"></i> Entrar
  </button>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden" style="display:flex;flex:1;height:100vh;">
<div id="sidebar">
  <div class="logo">SEI <span>Monitor</span></div>
  <nav>
    <a onclick="showView('dashboard')" id="nav-dashboard"><i class="fa fa-th-large"></i>Dashboard</a>
    <a onclick="showView('novo')"      id="nav-novo"><i class="fa fa-plus-circle"></i>Novo Processo</a>
    <a onclick="showView('admin')"     id="nav-admin" class="hidden"><i class="fa fa-cog"></i>Administração</a>
  </nav>
  <div class="ai-status">
    <span class="ai-dot" id="ai-dot"></span><span id="ai-status-txt">Verificando IA...</span>
  </div>
  <div class="user-info">
    <strong id="sidebar-nome">—</strong>
    <span id="sidebar-email"></span><br>
    <a href="#" onclick="logout()" style="color:#60a5fa;font-size:.75rem;">Sair</a>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <h1 id="page-title">Dashboard</h1>
    <div class="actions">
      <input type="text" id="search-input" placeholder="🔍 Buscar processo..."
        style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:.85rem;width:220px;"
        oninput="filtrarCards()">
      <button class="btn btn-primary" onclick="showView('novo')"><i class="fa fa-plus"></i> Novo</button>
    </div>
  </div>
  <div id="content"></div>
</div>
</div>

<!-- CHAT FAB -->
<div id="chat-fab">
  <button id="chat-btn" onclick="toggleChat()" title="Assistente IA"><i class="fa fa-robot"></i></button>
  <div id="chat-panel">
    <div id="chat-header">
      <span><i class="fa fa-robot" style="color:var(--primary);margin-right:6px;"></i>Assistente IA</span>
      <button onclick="toggleChat()" style="background:none;border:none;cursor:pointer;font-size:1rem;">✕</button>
    </div>
    <div id="chat-msgs">
      <div class="chat-msg ai">Olá! Posso responder perguntas sobre os processos monitorados. Como posso ajudar?</div>
    </div>
    <div id="chat-input-row">
      <input id="chat-input" placeholder="Digite sua pergunta..." onkeydown="if(event.key==='Enter')enviarChat()">
      <button class="btn btn-primary btn-sm" onclick="enviarChat()"><i class="fa fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<!-- Lógica do sistema -->
<script src="app.js"></script>
</body>
</html>
